name: Daily Horizon Summary

on:
  # 定时触发（schedule）已于 2026-09-02 移除。
  # 原因：GitHub schedule 为 best-effort，实测曾延迟 4–9.5 小时、甚至整日漏跑。
  # 现改由外部可靠 cron 调用 workflow_dispatch 触发：
  #   - 主触发源：OpenClaw 服务器（scripts/trigger-horizon.sh）
  #   - 兜底触发源：云函数（scripts/cloud-fallback/）
  # 请勿重新添加 schedule，否则会与外部触发源重复运行、重复消耗 token。
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      # 宵禁保护已于 2026-09-02 移除（原「Compute push window (curfew guard)」步骤）。
      # 原逻辑：仅在北京时间 19:00–23:59 内才注入飞书 webhook，避免定时任务被
      # GitHub 延迟到深夜时凌晨打扰。
      # 移除原因：schedule 已删除，改由外部可靠 cron 在 20:30 触发，不再有
      # 「被平台延迟数小时」的场景；而宵禁会让白天/傍晚的手动触发收不到飞书推送，
      # 影响验证与日常使用。
      # 若日后恢复 schedule 或改到深夜触发，可从 git 历史找回该步骤。

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 无条件推送飞书（宵禁已于 2026-09-02 移除，见上方注释）
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
